# CI manifest: the tools the quality gate needs, installed by toolchain/install into a temporary prefix.
#
# Owned by the template. Same rules as any pinned toolchain manifest: exact versions, an artifact
# and a SHA-256 for every declared architecture, no `latest`, hash-locked Python requirements.
# It is not a host profile. Changes are reviewed like code: record in the PR how each checksum
# was verified against the upstream release.
#
# `[architectures]` is the only place that maps an architecture name to the machine names
# (`uname -m`) that select it. The install engine holds no architecture name of its own.

schema_version = 1

[architectures]
amd64 = ["x86_64", "amd64"]
arm64 = ["aarch64", "arm64"]

# ---- downloads (release artifacts)

# yq (mikefarah). Release asset digests and a local download hash agree for both architectures.
[tools.yq]
version     = "4.54.3"
profiles    = ["gate"]
source      = "download"
format      = "binary"
binaries    = ["yq"]
smoke       = ["yq", "--version"]
smoke_match = "4.54.3"
max_bytes   = 104857600

[tools.yq.artifacts.amd64]
url    = "https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64"
sha256 = "129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973"

[tools.yq.artifacts.arm64]
url    = "https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_arm64"
sha256 = "89f69310b61b68d1245065a1241d1fc843f7a36cd6103ffd77ad987613bd1b67"

# ShellCheck. Upstream publishes no checksums: the release asset digest and a local download hash agree.
[tools.shellcheck]
version     = "0.11.0"
profiles    = ["gate"]
source      = "download"
format      = "tar.xz"
strip       = 1
binaries    = ["shellcheck"]
smoke       = ["shellcheck", "--version"]
smoke_match = "0.11.0"
max_bytes   = 104857600

[tools.shellcheck.artifacts.amd64]
url    = "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
sha256 = "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"

[tools.shellcheck.artifacts.arm64]
url    = "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.aarch64.tar.xz"
sha256 = "12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588"

# actionlint. Upstream actionlint_1.7.12_checksums.txt and the release asset digest agree for both architectures.
[tools.actionlint]
version     = "1.7.12"
profiles    = ["gate"]
source      = "download"
format      = "tar.gz"
binaries    = ["actionlint"]
smoke       = ["actionlint", "-version"]
smoke_match = "1.7.12"
max_bytes   = 104857600

[tools.actionlint.artifacts.amd64]
url    = "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
sha256 = "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

[tools.actionlint.artifacts.arm64]
url    = "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_arm64.tar.gz"
sha256 = "325e971b6ba9bfa504672e29be93c24981eeb1c07576d730e9f7c8805afff0c6"

# ---- pip (hash-locked: toolchain/python/ci.lock, installed with --require-hashes into <prefix>/venv)

[tools.yamllint]
profiles    = ["gate"]
source      = "pip"
lockfile    = "toolchain/python/ci.lock"
binaries    = ["yamllint"]
smoke       = ["yamllint", "--version"]
smoke_match = "1.38.0"

[tools.pymarkdownlnt]
profiles    = ["gate"]
source      = "pip"
lockfile    = "toolchain/python/ci.lock"
binaries    = ["pymarkdown"]
smoke       = ["pymarkdown", "version"]
smoke_match = "0.9.42"
