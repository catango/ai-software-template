# Configuration of this repository. Seeded: scripts/initialize-project writes it from the configuration it is given,
# and the repository owns it from then on. This copy drives the CI of the template itself.
schema_version: 1
# Identities. Public logins and the immutable numeric account ID of the approver (reviews are matched by the ID).
# Scripts read them from here and never infer them. The machine account is the one Claude Code works as.
github:
  owner: "catango"
  approver_login: "catango"
  approver_id: 25507517
  machine_login: "catango-gh-bot"
# Rule inputs of pr-contract. pr-contract reads this file from the BASE commit of a pull request, never from the head, so a
# change cannot widen the policy that judges it.
#   design_repos    repositories (owner/name) whose merged design pull requests an implementation may reference as
#                   <owner>/<repo>#<n>. The template's own records live in the repository listed here (rule PC-3).
#   docs_roots      directories that hold the change requests (<root>cr/) and the ADRs (<root>adr/). A design PR may change
#                   only paths under them (PC-4); an implementation or change PR may not change the approved records in
#                   them (PC-5). The template keeps its own records under template-dev/docs/.
#   operator_paths  paths whose change needs the PR section "Operator script review" (rule PC-8). Empty: the rule is inactive.
workflow:
  design_repos:
    - "catango/ai-lab-platform"
  docs_roots:
    - "docs/"
    - "template-dev/docs/"
  operator_paths: []
# Architectures of the CI matrix. Per architecture: `name`, `runner` (the runner label for a public repository) and
# `runner_private` (for a private one). An empty label means that no runner exists for that repository: the job for that
# architecture then writes "not run: <name>" instead of running the gate. Every name must be declared in
# toolchain/ci-manifest.toml, which holds the tool artifacts for it.
architectures:
  - name: "amd64"
    runner: "ubuntu-24.04"
    runner_private: "ubuntu-24.04"
  - name: "arm64"
    runner: "ubuntu-24.04-arm"
    runner_private: ""
