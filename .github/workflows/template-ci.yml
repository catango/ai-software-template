name: template-ci

# Template-only: removed by scripts/initialize-project. The jobs run the tests of template-dev/. The gate itself, with its
# fixtures (tests/quality-gate/), runs through ci.yml like in every generated repository. The aggregate `template-ci` is the
# third required check of the template repository.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: template-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # T-1 and the generation part of T-2: every file has one class, initialize-project removes every template-only path.
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the manifest tests
        shell: bash
        run: template-dev/run-tests.sh manifest

  # T-15 and the scan part of T-21: no identifier pattern and no platform reference in the payload or a generated tree.
  leak:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the leak tests
        shell: bash
        run: template-dev/run-tests.sh leak

  # the install engine and the CI manifest: both architectures and checksums, tamper and archive rules (T-14).
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the engine tests
        shell: bash
        run: template-dev/run-tests.sh engine

  # the CI matrix, the not-run summary, and the private-flag condition (T-3, gate part).
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the ci tests
        shell: bash
        run: template-dev/run-tests.sh ci

  # The fixture tests of scripts/pr-contract (T-8, T-20 rule part), the Skill scripts, and the gate-evidence script: steps 5 and 7 of
  # design section 12 (a). They run offline: no GitHub call. On both architectures; the pr-contract cases also run against a tree
  # generated from each configuration (tests/skills/test_generated_tree.py).
  skills:
    name: skills-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # yq is optional for these tests (the reader of the configuration is compared with it when it is present), and the
      # policy-command tests need it: it comes from the CI manifest, checksum-verified.
      - name: Install yq
        shell: bash
        run: |
          python3 -I toolchain/install install --profile gate --only yq --prefix "$RUNNER_TEMP/tools"
          echo "$RUNNER_TEMP/tools/bin" >> "$GITHUB_PATH"

      - name: Run the skills tests
        shell: bash
        run: template-dev/run-tests.sh skills

  # T-9 and T-10, step 6 of design section 12 (a): template-sync against local git repositories as the template, the lag line, and the
  # classes of the files of plan row 8, on both architectures. T-17 (the gate check owned-drift) runs in the gate through ci.yml.
  # The tests need no network and no credential.
  sync:
    name: sync-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the sync tests
        shell: bash
        run: template-dev/run-tests.sh sync

  # T-2, T-3 (the generated CI passes on ARM64), T-16 (a) and T-21: the scripted dry run of design section 12 (a), steps 1 to 4 and 8
  # (export, initialize-project, the gate in the generated repository, new-cr with cr-layout, the leak scan), on both architectures
  # with two different configurations. template-dev/dry-run.sh writes only inside its output directory and needs no network after the
  # tools are installed. The runner labels are those of config/project.yaml: the template repository is public, so the hosted ARM64
  # runner exists; a private repository would have none, and these legs would not start.
  generate:
    name: generate-${{ matrix.arch }}-${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        config: [neutral, second]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
          - config: neutral
            config_file: template-dev/fixtures/config/neutral.toml
          - config: second
            config_file: template-dev/fixtures/config/second/config.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The gate tools come from the CI manifest (checksum-verified, hash-locked) for this architecture, like in ci.yml.
      - name: Install the gate tools
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 -I toolchain/install install --profile gate --arch "$ARCH" --prefix "$RUNNER_TEMP/toolchain"
          echo "$RUNNER_TEMP/toolchain/bin" >> "$GITHUB_PATH"

      - name: Dry run
        shell: bash
        env:
          CONFIG_FILE: ${{ matrix.config_file }}
        run: |
          mkdir "$RUNNER_TEMP/dry-run"
          template-dev/dry-run.sh --template "$GITHUB_WORKSPACE" --config "$CONFIG_FILE" --out "$RUNNER_TEMP/dry-run" \
            | tee "$RUNNER_TEMP/dry-run-report.txt"

      - name: Report
        if: always()
        shell: bash
        run: |
          if [[ -f "$RUNNER_TEMP/dry-run-report.txt" ]]; then
            {
              echo '### dry run'
              echo
              echo '```'
              cat "$RUNNER_TEMP/dry-run-report.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The tests of the script itself (a patched, instant gate; the real gate ran above). Once per architecture.
      - name: Run the dry-run tests
        if: matrix.config == 'neutral'
        shell: bash
        run: template-dev/run-tests.sh dry-run

  # The one required check of this workflow: it needs every other job, always runs, and fails unless each succeeded.
  template-ci:
    needs: [manifest, leak, engine, ci, skills, sync, generate]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail unless every needed job succeeded
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 -I - <<'PY'
          import json
          import os
          import sys

          try:
              needs = json.loads(os.environ["NEEDS"])
          except (KeyError, ValueError):
              needs = None
          if not isinstance(needs, dict) or not needs:
              print("template-ci: the needs context is empty or unreadable")
              sys.exit(1)
          rows = sorted((name, str(job.get("result", "")) if isinstance(job, dict) else "") for name, job in needs.items())
          print("\n".join(f"{name}: {result or 'unknown'}" for name, result in rows))
          bad = [name for name, result in rows if result != "success"]
          if bad:
              print("template-ci: not successful: " + ", ".join(bad))
              sys.exit(1)
          PY
