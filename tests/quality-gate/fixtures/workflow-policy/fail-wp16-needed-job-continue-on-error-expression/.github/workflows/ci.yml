name: ci
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
permissions: {}
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - run: echo ok
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate]
    if: always()
    permissions: {}
    steps:
      - run: echo ok
