name: ci
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
permissions: {}
jobs:
  gate:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        runner: [ubuntu-latest]
        include:
          - runner: runner-x
    container:
      image: ubuntu:24.04@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    services:
      db:
        image: ubuntu:24.04@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - uses: ./.github/actions/local
      - name: Show
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE"
  second:
    name: toolchain-${{ matrix.arch }}
    runs-on: [ubuntu-latest]
    timeout-minutes: 5
    steps:
      - run: echo ok
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, second]
    if: always()
    permissions: {}
    steps:
      - run: echo ok
