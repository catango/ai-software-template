name: ci
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]
permissions: {}
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - id: plan
        run: echo ok
  gate:
    name: quality-gate-${{ matrix.arch }}
    needs: [plan]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4.2.2
        with:
          persist-credentials: false
      - run: echo ok
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, gate]
    if: always()
    permissions: {}
    steps:
      - run: echo ok
